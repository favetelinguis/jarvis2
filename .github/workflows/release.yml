name: release

# A tag builds on each native platform; publish only after every smoke check passes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: erlang elixir
      - name: Version from the tag
        run: echo "JARVIS2_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: mix local.hex --force && mix local.rebar --force
      - name: Fetch dependencies
        run: |
          for i in 1 2 3 4 5; do mix deps.get --only prod && exit 0; sleep $((i * 15)); done
          exit 1
      - run: mix compile --warnings-as-errors
      - run: mix release --overwrite
      - name: Archive
        run: |
          name="jarvis2-${JARVIS2_VERSION}-${{ matrix.target }}"
          tar -C _build/prod/rel/jarvis2 -czf "${name}.tar.gz" .
          echo "ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"
      - name: Smoke test extracted release
        run: |
          mkdir smoke && tar -C smoke -xzf "$ARCHIVE"
          smoke_dir="$PWD/smoke"
          smoke_script="$PWD/scripts/release-smoke.exs"
          cd "$RUNNER_TEMP"
          JARVIS2_STATE_DIR="$RUNNER_TEMP/jarvis2-smoke-data" \
            "$smoke_dir/bin/jarvis2" eval "$(<"$smoke_script")"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
