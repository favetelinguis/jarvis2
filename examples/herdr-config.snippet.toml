# Merge these entries into your Herdr config; replace <repo> with this repository path.
# Merge existing [ui], [ui.sidebar.agents], and [ui.sidebar.spaces] tables; do not duplicate them.

[ui]
tab_bar_right = [
  { type = "command", command = "<repo>/bin/status", interval_seconds = 5, timeout_seconds = 2 },
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "$agent_state"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status", "$last_tool"],
]
